# Conda environment for this repo. The earlier file here was a `conda env export` pinned to linux-64 builds
# (unusable on macOS); the package's requirements live in pyproject.toml, so this file only provides the
# interpreter and installs the package in editable mode with the dev + notebooks extras.
#
#   conda env create -f environment.yml && conda activate poly_ingest
#
name: poly_ingest
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -e .[dev,notebooks]
